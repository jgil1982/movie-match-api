openapi: 3.0.0
info:
  title: Movie Match API
  version: 1.0.0
  description: API de películas con IA integrada

servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://movie-match-api-44vf.onrender.com
    description: Producción

paths:
  /health:
    get:
      summary: Health check del servidor
      description: Verifica el estado del servidor y retorna información de uptime
      responses:
        '200':
          description: Servidor funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-01-15T20:00:00.000Z"
                  uptime:
                    type: number
                    description: Tiempo en segundos desde que inició el servidor
                    example: 3600.5

  /movies:
    get:
      summary: Obtener todas las películas
      description: Retorna lista de películas con filtros opcionales
      parameters:
        - name: year
          in: query
          schema:
            type: integer
          description: Filtrar por año
        - name: minRating
          in: query
          schema:
            type: number
          description: Rating mínimo
      responses:
        '200':
          description: Lista de películas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviesResponse'

    post:
      summary: Crear nueva película
      description: Agrega una nueva película a la base de datos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '201':
          description: Película creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '500':
          description: Error del servidor

  /movies/discover:
    get:
      summary: Descubrir películas con IA
      description: Retorna películas enriquecidas con anécdotas y datos curiosos generados por IA
      responses:
        '200':
          description: Películas con contenido de IA
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Movie'
                        - type: object
                          properties:
                            ai_enriched:
                              type: string
                              nullable: true
                              example: "Michael J. Fox no fue el primer Marty McFly."

  /movies/{id}:
    get:
      summary: Obtener película por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Película encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Película no encontrada

    put:
      summary: Actualizar película
      description: Actualiza una película existente por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovieInput'
      responses:
        '200':
          description: Película actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieResponse'
        '404':
          description: Película no encontrada

    delete:
      summary: Eliminar película
      description: Elimina una película por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Película eliminada
        '404':
          description: Película no encontrada

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "The Shawshank Redemption"
        year:
          type: integer
          example: 1994
        rating:
          type: number
          format: float
          example: 9.3
        poster:
          type: string
          nullable: true
          example: "https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MovieInput:
      type: object
      required:
        - title
        - year
        - rating
      properties:
        title:
          type: string
          example: "Inception"
        year:
          type: integer
          example: 2010
        rating:
          type: number
          format: float
          example: 8.8
        poster:
          type: string
          nullable: true
          example: "https://image.tmdb.org/t/p/w500/poster.jpg"

    MovieResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
        count:
          type: integer
          example: 1

    MoviesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Movie'
        count:
          type: integer
          example: 10
